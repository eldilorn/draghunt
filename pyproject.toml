[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealer"
version = "0.5.0"
description = "Randomized, MITRE-mapped attack reps graded against sealed ground truth in your own SIEM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "eldilorn" }]
keywords = ["blue-team", "detection-engineering", "wazuh", "mitre-attack", "soc"]
dependencies = []  # core runs on the standard library only

[project.scripts]
dealer = "dealer.cli:main"

[project.optional-dependencies]
# Reserved for the future hosted grading/tracking layer. Not needed for the core.
hosted = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools]
packages = ["dealer"]

[tool.setuptools.package-data]
dealer = ["data/catalog/*.json"]
