[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draghunt"
version = "0.8.0"
description = "Randomized, MITRE-mapped attack reps graded against sealed ground truth in your own SIEM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "eldilorn" }]
keywords = ["blue-team", "detection-engineering", "wazuh", "mitre-attack", "soc"]
dependencies = []  # core runs on the standard library only

[project.scripts]
draghunt = "draghunt.cli:main"

[project.optional-dependencies]
# Native desktop window. The core and the web dashboard need neither of these.
desktop = ["pywebview>=5"]
# Reserved for the future hosted grading/tracking layer. Not needed for the core.
hosted = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.gui-scripts]
draghunt-desktop = "draghunt.desktop:main"

[tool.setuptools]
packages = ["draghunt"]

[tool.setuptools.package-data]
draghunt = ["data/catalog/*.json"]
